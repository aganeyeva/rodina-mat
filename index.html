<!doctype html>
<html lang="tt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Плакатлар</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #141414;
    color: #f5f2ea;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  img#poster {
    max-height: 78vh; max-width: 92vw;
    border: 3px solid #d93a2b;
    box-shadow: 0 0 40px rgba(217,58,43,.25);
    background: #fbfaf6;
  }
</style>
</head>
<body>
  <img id="poster" alt="постер">
<script>
  var MORNING = 'img/tesh.jpg';
  var EVENING = ['img/kiyem.jpg', 'img/dog-kiyem.jpg'];
  var DAY = [
    'img/posudomoyka.jpg',
    'img/oscar.jpg',
    'img/lunchbox.jpg',
    'img/bulma.jpg',
    'img/dog-bulma.jpg'
  ];
  function pick(){
    var now = new Date(),
        h = now.getHours(),
        slot = Math.floor((h * 60 + now.getMinutes()) / 10),
        src;
    if (h >= 6 && h < 9) {
      src = MORNING;

    } else if (h >= 19 && h < 23) {
      src = EVENING[slot % EVENING.length];

    } else {
      src = DAY[slot % DAY.length];
    }
    document.getElementById('poster').src = src;
  }
  pick();
  setInterval(pick, 60000);
</script>
</body>
</html>
